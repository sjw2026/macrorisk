steps:
- name: 저장소 코드 체크아웃
  uses: actions/checkout@v4

- name: 파이썬 환경 설정 (3.10)
  uses: actions/setup-python@v5
  with:
    python-version: '3.10'

- name: 필수 의존성 설정
  run: |
    python -m pip install --upgrade pip
    # 추가 무거운 라이브러리 없이 파이썬 내장 라이브러리로 초고속 작동하도록 설계되었습니다.

- name: 실시간 매크로 금융 데이터 갱신 스크립트 실행
  run: python update_data.py

- name: 갱신된 HTML 코드 자동 커밋 및 푸시
  run: |
    git config --global user
