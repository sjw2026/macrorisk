name: Daily Live Macro Data Update

# 매일 한국 시간 오전 9시 자동 실행 및 언제든 수동 실행 활성화
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # 이 구문이 정상 작동해야 수동 실행 버튼이 나타납니다.

jobs:
  update-macro-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write # index.html 파일 수정을 위한 권한 허용

    steps:
      # 1. 저장소의 소스코드 체크아웃
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. 올바른 공식 파이썬 환경 설치 (setup-python 사용)
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Canvas의 update_data.py가 파이썬 내장 라이브러리만 사용하므로 무거운 pip 설치 프로세스 생략 (에러 가능성 0%)

      # 3. 데이터 수집 스크립트 실행
      - name: Execute Live Data Collection
        run: python update_data.py

      # 4. 수집된 결과 자동 커밋 및 푸시
      - name: Auto Commit and Push Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.html
          if git diff --staged --quiet; then
            echo "No market data updates found today."
          else
            git commit -m "🌐 [Automated] 실시간 매크로 지수 및 주가지수 등락률 동기화 완료"
            git push
          fi
